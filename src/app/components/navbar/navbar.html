<nav class="navbar">
    <div class="navbar-container">
        <div class="navbar-brand">
            <a routerLink="/home" class="navbar-logo">
                <span class="logo-text">💳 Mini-Banking</span>
            </a>
        </div>

        <div class="navbar-status">
            <button class="theme-toggle" (click)="toggleTheme()" [title]="isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
                {{ isDarkMode ? '☀️' : '🌙' }}
            </button>
            <ng-template #notAuthenticated>
                <a routerLink="/login" class="navbar-link">Login</a>
            </ng-template>
        </div>

        <button class="navbar-toggle" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen">
            <span class="hamburger"></span>
            <span class="hamburger"></span>
            <span class="hamburger"></span>
        </button>

        <div class="navbar-menu" [class.active]="menuOpen" *ngIf="miniBanking.isLoggedIn()">
            <ul class="navbar-list">
                <li class="navbar-item">
                    <a routerLink="/deposit" class="navbar-link" (click)="menuOpen = false">Register Deposit</a>
                </li>
                <li class="navbar-item">
                    <a routerLink="/withdrawal" class="navbar-link" (click)="menuOpen = false">Register Withdrawal</a>
                </li>
                <li class="navbar-item">
                    <a routerLink="/movements" class="navbar-link" (click)="menuOpen = false">Movements</a>
                </li>
                <li class="navbar-item">
                    <a routerLink="/balance" class="navbar-link" (click)="menuOpen = false">Current Balance</a>
                </li>
                <li class="navbar-item">
                    <a routerLink="/convert-fiat" class="navbar-link" (click)="menuOpen = false">Convert Fiat</a>
                </li>
                <li class="navbar-item">
                    <a routerLink="/convert-crypto" class="navbar-link" (click)="menuOpen = false">Convert Crypto</a>
                </li>
                <li class="navbar-item logout-item">
                    <button type="button" class="navbar-link navbar-logout" (click)="logout()">Logout</button>
                </li>
            </ul>
        </div>
    </div>
</nav>
