<div class="card animate-fade-in max-w-form">
  <h3>Register Withdrawal</h3>
  <p>Securely withdraw funds from your account.</p>

  <div class="form-group">
    <label for="withdraw-amount">Amount (€)</label>
    <input 
      id="withdraw-amount"
      type="number" 
      placeholder="0.00" 
      [(ngModel)]="amount" 
      [disabled]="isLoading()"
    >
  </div>

  <div class="form-group">
    <label for="withdraw-desc">Description</label>
    <input 
      id="withdraw-desc"
      type="text" 
      placeholder="Reason for withdrawal" 
      [(ngModel)]="description" 
      [disabled]="isLoading()"
    >
  </div>

  <button class="btn btn-primary w-full" (click)="onWithdraw()" [disabled]="isLoading()">
    {{ isLoading() ? 'Processing...' : 'Register Withdrawal' }}
  </button>

  @if (message()) {
    <p class="status-message animate-fade-in" [ngClass]="isSuccess() ? 'success' : 'error'">
      {{ message() }}
    </p>
  }
</div>
