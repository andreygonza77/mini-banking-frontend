<div class="card animate-fade-in max-w-form">
  <h3>Convert to Fiat</h3>
  <p>Select a target currency to convert your funds.</p>

  <div class="form-group">
    <label for="fiat-target">Target Currency</label>
    <select id="fiat-target" [ngModel]="target()" (ngModelChange)="target.set($event)">
      <option value="INR">Indian Rupee (INR)</option>
      <option value="USD">US Dollar (USD)</option>
      <option value="GBP">British Pound (GBP)</option>
      <option value="JPY">Japanese Yen (JPY)</option>
      <option value="CHF">Swiss Franc (CHF)</option>
      <option value="AUD">Australian Dollar (AUD)</option>
      <option value="CNY">Chinese Yuan (CNY)</option>
    </select>
  </div>

  <button class="btn btn-primary w-full" (click)="onConvert()" [disabled]="isLoading()">
    {{ isLoading() ? 'Converting...' : 'Convert' }}
  </button>

  <div class="status-message animate-fade-in success" *ngIf="result()">
    {{ result() }}
  </div>

  <div class="status-message animate-fade-in error" *ngIf="error()">
    {{ error() }}
  </div>
</div>
