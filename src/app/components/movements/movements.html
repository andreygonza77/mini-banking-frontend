<div class="card animate-fade-in">
  <div class="movements-header">
    <h3>Recent Movements</h3>
    <button class="btn btn-secondary btn-sm" (click)="deleteLastMovement()" *ngIf="movements() && movements()!.length > 0">
      Delete Last
    </button>
  </div>
  
  <p>Track your recent account activity below:</p>

  <div class="movements-list">
    <div class="movement-item" *ngFor="let movement of movements()">
      <a [routerLink]="['/movements', movement.id]" class="movement-link">
        <div class="movement-info">
          <span class="movement-id">#{{ movement.id }}</span>
          <span class="movement-desc">{{ movement.description }}</span>
        </div>
        <div class="movement-meta">
          <span class="movement-amount" [class.negative]="movement.amount < 0">
            {{ movement.amount > 0 ? '+' : '' }}{{ movement.amount }} €
          </span>
          <span class="movement-date">{{ movement.created_at | date:'short' }}</span>
        </div>
      </a>
    </div>
  </div>

  <div class="empty-state" *ngIf="!movements() || movements()!.length === 0">
    <p>No movements found.</p>
  </div>
</div>
