<h3>List of movements</h3>
<p>Here you can see the list of your recent movements:</p>
<ul>
    <li *ngFor="let movement of movements()"> 
        <a [routerLink]="['/movements', movement.id]">
            [{{ movement.id }}] {{ movement.description }} - € {{ movement.amount }} ({{ movement.created_at }})
        </a>
    </li>
</ul>

<button (click)="deleteLastMovement()" *ngIf="movements() && movements()!.length > 0">
    Delete the last movement
</button>
