<div class="card animate-fade-in max-w-form">
  <h3>Register Deposit</h3>
  <p>Securely add funds to your account.</p>

  <div class="form-group">
    <label for="deposit-amount">Amount (€)</label>
    <input 
      id="deposit-amount"
      type="number" 
      placeholder="0.00" 
      [(ngModel)]="amount" 
      [disabled]="isLoading()"
    >
  </div>

  <div class="form-group">
    <label for="deposit-desc">Description</label>
    <input 
      id="deposit-desc"
      type="text" 
      placeholder="Reason for deposit" 
      [(ngModel)]="description" 
      [disabled]="isLoading()"
    >
  </div>

  <button class="btn btn-primary w-full" (click)="onDeposit()" [disabled]="isLoading()">
    {{ isLoading() ? 'Processing...' : 'Register Deposit' }}
  </button>

  @if (message()) {
    <p class="status-message animate-fade-in" [ngClass]="isSuccess() ? 'success' : 'error'">
      {{ message() }}
    </p>
  }
</div>
